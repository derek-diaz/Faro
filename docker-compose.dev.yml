name: faro-dev

services:
  faro:
    build:
      context: .
      dockerfile: docker/Dockerfile.all-in-one.dev
    environment:
      FARO_QUERY_LOG_MAX_BYTES: ${FARO_QUERY_LOG_MAX_BYTES:-10485760}
      FARO_QUERY_LOG_BACKUPS: ${FARO_QUERY_LOG_BACKUPS:-2}
    volumes:
      - .:/app
      - faro-data:/data
      - coredns-config:/coredns
      - coredns-logs:/var/log/coredns
      - go-build-cache:/root/.cache/go-build
      - frontend-node-modules:/app/frontend/node_modules
      - frontend-npm-cache:/root/.npm
    ports:
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_UI_PORT:-1787}:1787"
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DEV_DNS_PORT:-5354}:53/udp"
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DEV_DNS_PORT:-5354}:53/tcp"
    logging:
      driver: json-file
      options:
        max-size: "${FARO_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${FARO_DOCKER_LOG_BACKUPS:-3}"
    stop_grace_period: 20s

volumes:
  faro-data:
  coredns-config:
  coredns-logs:
  go-build-cache:
  frontend-node-modules:
  frontend-npm-cache:
