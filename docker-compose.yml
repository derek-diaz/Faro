services:
  faro-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      FARO_DB_PATH: /data/faro.db
      FARO_COREDNS_CONFIG_DIR: /coredns
      FARO_COREDNS_LOG_PATH: /var/log/coredns/query.log
      FARO_COREDNS_METRICS_URL: http://coredns:9153/metrics
    volumes:
      - faro-data:/data
      - coredns-config:/coredns
      - coredns-logs:/var/log/coredns
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  faro-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      faro-api:
        condition: service_healthy
    ports:
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_UI_PORT:-1787}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  coredns:
    build:
      context: .
      dockerfile: docker/Dockerfile.coredns
    depends_on:
      faro-api:
        condition: service_healthy
    volumes:
      - coredns-config:/etc/coredns
      - coredns-logs:/var/log/coredns
    ports:
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DNS_PORT:-53}:53/udp"
      - "${FARO_BIND_ADDRESS:-0.0.0.0}:${FARO_DNS_PORT:-53}:53/tcp"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9153/metrics"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  faro-data:
  coredns-config:
  coredns-logs:
