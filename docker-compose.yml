services:
  faro-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: faro-api
    env_file:
      - .env
    environment:
      FARO_DB_PATH: /data/faro.db
      FARO_COREDNS_CONFIG_DIR: /coredns
      FARO_COREDNS_LOG_PATH: /var/log/coredns/query.log
    volumes:
      - faro-data:/data
      - coredns-config:/coredns
      - coredns-logs:/var/log/coredns
    ports:
      - "${FARO_API_PORT:-8080}:8080"
    restart: unless-stopped

  faro-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: faro-ui
    depends_on:
      - faro-api
    ports:
      - "${FARO_UI_PORT:-3000}:80"
    restart: unless-stopped

  coredns:
    build:
      context: .
      dockerfile: docker/Dockerfile.coredns
    container_name: faro-coredns
    depends_on:
      - faro-api
    volumes:
      - coredns-config:/etc/coredns
      - coredns-logs:/var/log/coredns
    ports:
      - "${FARO_DNS_PORT:-5353}:53/udp"
      - "${FARO_DNS_PORT:-5353}:53/tcp"
    restart: unless-stopped

volumes:
  faro-data:
  coredns-config:
  coredns-logs:
