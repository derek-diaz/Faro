root = "."
tmp_dir = ".tmp/air"

[build]
cmd = "go build -o ./.tmp/air/faro-api ./cmd/faro-api"
entrypoint = ["./.tmp/air/faro-api"]
include_ext = ["go", "mod", "sum"]
exclude_dir = [".git", ".idea", ".tmp", "frontend", "vendor"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
