worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 1787;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /api/backups/restore {
            client_max_body_size 4160m;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/faro-proxy-headers.conf;
        }

        location = /api/backups {
            proxy_buffering off;
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/faro-proxy-headers.conf;
        }

        location = /api/redundancy/replica/snapshot {
            proxy_buffering off;
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/faro-proxy-headers.conf;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            include /etc/nginx/faro-proxy-headers.conf;
        }

        location /healthz {
            proxy_pass http://127.0.0.1:8080;
        }

        location /metrics {
            proxy_pass http://127.0.0.1:8080;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
